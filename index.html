<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kaamsetu - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "on-secondary-fixed": "#291800",

<style>
        .custom-shadow {
            box-shadow: 0 4px 20px rgba(9, 20, 38, 0.05); /* Level 1-ish ambient shadow */
        }
        .input-focus:focus {
            outline: none;
            border-bottom-color: #745a38; /* Bronze accent */
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Main Content Area (Login Form) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Subtle Background Depth Graphic (Optional) -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none opacity-20 flex justify-center items-center">
<div class="w-[800px] h-[800px] rounded-full bg-surface-container blur-[100px]"></div>
</div>
<div class="w-full max-w-md md:max-w-[520px] bg-surface-container-lowest border border-surface-variant rounded-xl custom-shadow p-8 md:p-12 z-10 relative">
<!-- Header -->
<div class="text-center mb-10 md:mb-12">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary tracking-tight mb-2 md:mb-4">Welcome back</h1>
<p class="font-body-md text-body-md md:font-body-lg md:text-body-lg text-on-surface-variant">Sign in to your Kaamsetu account.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6 md:space-y-8" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 uppercase" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-2 md:py-3 px-0 text-on-surface font-body-md focus:ring-0 input-focus transition-colors" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:opacity-80 transition-opacity" href="#">Forgot Password?</a>
</div>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-2 md:py-3 px-0 text-on-surface font-body-md focus:ring-0 input-focus transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-sm text-label-sm py-4 md:py-5 rounded uppercase tracking-widest hover:opacity-90 transition-opacity flex justify-center items-center gap-2 mt-8 md:mt-10" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-8 md:mt-10 mb-6 md:mb-8 flex items-center text-on-surface-variant">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="px-4 font-label-sm text-label-sm">OR</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-4 md:gap-6">
<button class="flex items-center justify-center gap-3 border border-outline-variant py-3 md:py-4 rounded hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">mail</span>
<span class="font-label-sm text-label-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-3 border border-outline-variant py-3 md:py-4 rounded hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">ios</span>
<span class="font-label-sm text-label-sm">Apple</span>
</button>
</div>
<!-- Sign Up Link -->
<div class="mt-10 md:mt-12 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:text-secondary transition-colors ml-1" href="#">Create an account</a>
</p>
</div>
</div>
</main>
</body></html>
